schema_version: "1.1"
name: drawing-c4-diagrams-12
expected_outcome: |
  Pulls the consolidated `structurizr/structurizr` image for Tier 1 (the `<release>-playwright` tag, so PNG/SVG export works), not the frozen `structurizr/lite` or `structurizr/cli` images (whose `:latest` is now a stub that exits immediately)
  Uses the vNext subcommand names (`local`, `validate`, `export`, `inspect`, `generate`, `playground`) rather than the retired Lite/CLI product names
  Treats `structurizr/mcp` as a separate image, only needed for the Tier 2 MCP inner loop
  Defaults MCP to local Docker rather than the public `mcp.structurizr.com`
