name: Release assets

# When changesets pushes a version tag (release.yml), publish a GitHub Release with the
# plugin archive and signed SLSA provenance (*.intoto.jsonl). Scorecard's
# Signed-Releases check scores a release 10 when it carries provenance.
#
# Releases are immutable (repo setting), so assets can't be added after publishing: the
# release is created last, in one step, with both files.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pack the plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="allensanborn-skills-${TAG}/" \
            -o "dist/allensanborn-skills-${TAG}.tar.gz" HEAD -- .claude-plugin skills LICENSE README.md

      - name: Hash the archive
        id: hash
        run: echo "hashes=$(cd dist && sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 5

  provenance:
    needs: build
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance with Sigstore
      contents: write # required by the generator's upload path, even with upload-assets off
    # The SLSA generator must be referenced by tag: it verifies its own ref. Scorecard's
    # Pinned-Dependencies check flags this line; that cost is accepted (see SECURITY.md).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}

  release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="## ${TAG#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
